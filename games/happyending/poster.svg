<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img"
     aria-label="Scattered points with five of them outlined as a convex pentagon">
  <!-- Points on a field, and the convex pentagon hiding among them. The shape
       was always going to be there; the game is about how long you can keep it
       from appearing. -->
  <defs>
    <style>
      .field { fill: #14261f; }
      .pt    { fill: #d9a441; stroke: #0e1a15; stroke-width: 1.5; }
      .dim   { fill: #7f6a44; stroke: #0e1a15; stroke-width: 1.5; }
      .found { fill: #ef7a6a2e; stroke: #ef7a6a; stroke-width: 2; stroke-linejoin: round; }
    </style>
  </defs>
  <rect class="field" x="0" y="0" width="320" height="180" rx="10"/>
  <polygon class="found" points="52,132 96,36 206,28 274,96 178,158"/>
  <circle class="dim" cx="140" cy="92" r="6"/>
  <circle class="dim" cx="176" cy="70" r="6"/>
  <circle class="dim" cx="112" cy="112" r="6"/>
  <circle class="pt" cx="52"  cy="132" r="7"/>
  <circle class="pt" cx="96"  cy="36"  r="7"/>
  <circle class="pt" cx="206" cy="28"  r="7"/>
  <circle class="pt" cx="274" cy="96"  r="7"/>
  <circle class="pt" cx="178" cy="158" r="7"/>
</svg>
