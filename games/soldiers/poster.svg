<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img"
     aria-label="Checkers below a dashed line, one of them jumping across it">
  <!-- Soldiers below the line and one arriving above it. The dashed line is
       the whole game: everything starts on one side of it. -->
  <defs>
    <style>
      .above { fill: #101f1b; }
      .below { fill: #16302a; }
      .cell  { fill: #ffffff05; stroke: #ffffff12; stroke-width: 1; }
      .line  { stroke: #e8c37a; stroke-width: 2.5; stroke-dasharray: 8 6; }
      .man   { fill: #c9a15e; stroke: #0e1a15; stroke-width: 2; }
      .up    { fill: #6fdc9a; stroke: #d6ffe8; stroke-width: 2.5; }
      .hop   { fill: none; stroke: #6fdc9a; stroke-width: 2; stroke-dasharray: 4 3; }
    </style>
  </defs>
  <rect class="above" x="0" y="0" width="320" height="76" rx="10"/>
  <rect class="below" x="0" y="76" width="320" height="104"/>
  <g class="cell">
    <rect x="88"  y="20"  width="36" height="36" rx="4"/>
    <rect x="128" y="20"  width="36" height="36" rx="4"/>
    <rect x="168" y="20"  width="36" height="36" rx="4"/>
    <rect x="88"  y="88"  width="36" height="36" rx="4"/>
    <rect x="128" y="88"  width="36" height="36" rx="4"/>
    <rect x="168" y="88"  width="36" height="36" rx="4"/>
    <rect x="88"  y="128" width="36" height="36" rx="4"/>
    <rect x="128" y="128" width="36" height="36" rx="4"/>
    <rect x="168" y="128" width="36" height="36" rx="4"/>
  </g>
  <line class="line" x1="0" y1="76" x2="320" y2="76"/>
  <path class="hop" d="M146 146 q 0 -60 0 -108"/>
  <circle class="up"  cx="146" cy="38"  r="14"/>
  <circle class="man" cx="106" cy="106" r="14"/>
  <circle class="man" cx="186" cy="106" r="14"/>
  <circle class="man" cx="106" cy="146" r="14"/>
  <circle class="man" cx="186" cy="146" r="14"/>
</svg>
