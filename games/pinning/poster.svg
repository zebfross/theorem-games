<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img"
     aria-label="Two loops of rope crossing, with pins placed in the spaces between them">
  <!-- Two loops crossing twice, with pins in two of the spaces they enclose:
       the four-crossing, two-loop level, drawn the way the game draws it so the
       card looks like the thing it opens. -->
  <defs>
    <style>
      .shadow { fill: none; stroke: #00000055; stroke-linejoin: round; stroke-linecap: round; }
      .core   { fill: none; stroke: #8a5a1c; stroke-linejoin: round; stroke-linecap: round; }
      .top    { fill: none; stroke: #d9a441; stroke-linejoin: round; stroke-linecap: round; }
    </style>
    <path id="wide" d="M 52 84 H 244 A 16 16 0 0 1 260 100 V 138 A 16 16 0 0 1 244 154
                       H 52 A 16 16 0 0 1 36 138 V 100 A 16 16 0 0 1 52 84 Z"/>
    <path id="tall" d="M 150 30 H 210 A 16 16 0 0 1 226 46 V 112 A 16 16 0 0 1 210 128
                       H 150 A 16 16 0 0 1 134 112 V 46 A 16 16 0 0 1 150 30 Z"/>
  </defs>

  <use href="#wide" class="shadow" stroke-width="20" transform="translate(2,3)"/>
  <use href="#wide" class="core" stroke-width="15"/>
  <use href="#wide" class="top" stroke-width="8"/>

  <use href="#tall" class="shadow" stroke-width="20" transform="translate(2,3)"/>
  <use href="#tall" class="core" stroke-width="15"/>
  <use href="#tall" class="top" stroke-width="8"/>

  <!-- pins, in two of the spaces the ropes close off -->
  <g>
    <circle cx="180" cy="106" r="9" fill="#00000055" transform="translate(1.5,2.5)"/>
    <circle cx="180" cy="106" r="9" fill="#e8c37a" stroke="#6b4a12" stroke-width="1.5"/>
    <circle cx="180" cy="106" r="2.3" fill="#00000066"/>
    <circle cx="88" cy="119" r="9" fill="#00000055" transform="translate(1.5,2.5)"/>
    <circle cx="88" cy="119" r="9" fill="#e8c37a" stroke="#6b4a12" stroke-width="1.5"/>
    <circle cx="88" cy="119" r="2.3" fill="#00000066"/>
  </g>
</svg>
