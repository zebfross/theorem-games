# Check, then publish to theorem.games.
#
# The site is static — no build step, no bundler — so deploying is a file copy
# and the interesting part is what runs before it. Both checks here exist
# because the failures they catch are silent ones: a stylesheet that reaches
# past the board and disables the level picker, or a registry promising levels
# whose files were never written. Neither shows up until somebody clicks.
#
# Pull requests get the checks and nothing else. Only main deploys.

name: check and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A second push while the first is still copying would interleave two rsyncs
  # into the same directory. Let the newer one win and cancel the older.
  group: deploy
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: No game stylesheet reaches a class the engine styles
        run: python3 tools/check_styles.py

      - name: Every level the index promises is present and parses
        run: python3 tools/check_data.py

      - name: Every tool still compiles
        run: python3 -m compileall -q lib tools games

  deploy:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5

      - name: Load the deploy key
        # The host key is pinned in a secret rather than fetched with
        # ssh-keyscan at deploy time. Keyscan is a network call to a shared host
        # that rate-limits, and it failed one run in four from a runner — with
        # its stderr sent to /dev/null, so the log said only "exit code 1".
        # Pinning removes the call, and trusting a key recorded once beats
        # trusting whatever answers on the day.
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "${{ secrets.DEPLOY_HOSTKEY }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts || { echo "no host key"; exit 1; }

      - name: Publish
        # --delete makes the server mirror the repo, so a game removed here
        # disappears there without anybody remembering to go and delete it.
        # The two excludes are directories the server owns rather than the
        # repo: .well-known is how the host proves the domain to Let's Encrypt
        # at renewal time, and deleting it would break the certificate.
        #
        # Only what the site actually serves is sent. lib/ is build-time Python,
        # tools/ builds the packs, and reference/ is a 733MB catalogue clone.
        #
        # .htaccess is listed explicitly because it is a dotfile and because
        # --delete would otherwise remove it: it lives in the docroot, so a
        # deploy that did not send it would treat it as something the repo had
        # deleted, and the host's week-long asset caching would come back.
        run: |
          rsync -az --delete \
            --exclude '.well-known' --exclude 'cgi-bin' \
            -e "ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=yes" \
            .htaccess index.html play.html engine games explorations docs \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}"

      - name: It is actually up
        # A deploy that copied files onto a host serving something else is not
        # a deploy. This asks the live site the same questions a visitor's
        # browser would, over the real certificate.
        run: |
          set -e
          for url in \
            "https://theorem.games/" \
            "https://theorem.games/games/registry.json" \
            "https://theorem.games/engine/engine.js" \
            "https://theorem.games/explorations/registry.json" \
            "https://theorem.games/explorations/mandelbrot/"; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$url")
            echo "  $code  $url"
            [ "$code" = "200" ] || exit 1
          done
